# Start everything:  docker compose up --build
# Only the database: docker compose up -d postgres   (then ./mvnw spring-boot:run on your machine)
# Stop:              docker compose down     (the volume stays, so the data is kept)
# Wipe the data:     docker compose down -v
services:
  postgres:
    # The -alpine image: plain postgres:16 can reject the Europe/Kiev time zone.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "healthy" only when the database accepts connections
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dev mode: the code is mounted from your machine. Devtools restarts the app
  # after you build in the IDE (target/classes). Attach a debugger on port 5005.
  app:
    build:
      context: .
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "127.0.0.1:5005:5005"
    volumes:
      - .:/app
      - m2:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookstore
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 2s
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 1s

  # Run the built jar, like in production:
  #   docker compose --profile prod up --build app-prod
  app-prod:
    profiles: ["prod"]
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookstore

volumes:
  pgdata:
  m2:
